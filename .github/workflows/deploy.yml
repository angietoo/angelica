name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127969245284/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@angelicareams-prod.iam.gserviceaccount.com
          token_format: 'access_token'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: firebase deploy --only hosting --project angelicareams-prod --token "${{ steps.auth.outputs.access_token }}" --non-interactive